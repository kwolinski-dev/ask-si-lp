<button
  type="button"
  class="card-item flex flex-col justify-between"
  [class.active]="active()"
  [attr.aria-labelledby]="labelId"
  [attr.aria-describedby]="textId"
  (click)="onCardClick()"
>
  <img class="card-item-image" [src]="item().photoUrl" alt="" />

  @if (hint() === 'peek') {
    <span class="card-item-peek" aria-hidden="true">{{ item().text }}</span>
  }

  <span [id]="labelId" class="card-item-label text-[28px] leading-[110%] font-light">
    {{ item().title }}
  </span>

  <span
    [id]="textId"
    class="card-item-text my-auto text-[16px] leading-[130%] font-light tracking-[0.06em]"
  >
    {{ item().text }}
  </span>
</button>
