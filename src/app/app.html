<div class="wd-container">
  <div class="w-full">
    <img src="/LogoAskSI.svg" alt="Ask SI logo" class="wd-img" class="w-auto h-10" />
  </div>

  <div class="w-full h-[503px] flex justify-between items-end">
    <div>
      <div class="text-[82px] leading-[100%]">
        <p class="font-bold">Let's build</p>
        <p class="font-bold">the future.</p>
        <p class="font-light">Faster.</p>
      </div>

      <div class="text-[28px] leading-[125%] font-bold mt-10 text-[#FFFFFF] opacity-70">
        <p>Supercharge for your</p>
        <p>business with Ask SI.</p>
      </div>
    </div>

    <div class="flex">
      @for (item of items(); track $index) {
        <app-card-item [item]="item" />
      }
    </div>
  </div>

  <div class="w-full text-2xl flex items-center gap-4">
    <div class="contact-track">
      <div>Got questions?</div>
      <div class="contact-line"></div>
      <a class="mail-link" href="mailto:info@asksi.com">info@asksi.com</a>
    </div>
  </div>
</div>
