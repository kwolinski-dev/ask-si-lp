<div class="wd-container">
  <div class="w-full">
    <img src="LogoAskSI.svg" alt="Ask SI logo" class="wd-img" class="w-auto h-7 md:h-10" />
  </div>

  <div
    class="w-full flex mt-12 min-h-[693px] flex-col justify-between md:h-[503px] md:min-h-0 md:flex-row md:mt-0 md:items-end"
  >
    <div>
      <div class="text-5xl leading-[110%] md:text-[82px] md:leading-[100%]">
        <p class="font-bold">Let's build</p>
        <p class="font-bold">the future.</p>
        <p class="font-light">Faster.</p>
      </div>

      <div
        class="font-bold text-[#FFFFFF] opacity-70 mt-4 text-lg leading-[120%] md:mt-10 md:text-[28px] md:leading-[125%]"
      >
        <p>Supercharge for your</p>
        <p>business with Ask SI.</p>
      </div>
    </div>

    <div
      class="card-items-row flex overflow-y-hidden overflow-x-scroll mb-12 md:mb-0"
      [class.card-items-row--dragging]="isDraggingCards()"
      (mousedown)="onCardsDragStart($event)"
      (mousemove)="onCardsDragMove($event)"
      (mouseup)="onCardsDragEnd()"
      (mouseleave)="onCardsDragEnd()"
    >
      @for (item of items(); track $index) {
        <app-card-item
          [class]="$index === 0 ? 'md:ml-12' : 'ml-12'"
          [item]="item"
          [active]="activeCardIndices().has($index)"
          (cardClicked)="onCardClicked($index)"
        />
      }
    </div>
  </div>

  <div class="w-full flex items-center gap-4 md:text-2xl">
    <div class="contact-track">
      <div>Got questions?</div>
      <div class="contact-line"></div>
      <div class="mail-hit" (click)="copyEmail()">
        <div class="mail-icon-wrap">
          <img src="copie.svg" alt="" class="mail-icon" [class.mail-icon--hidden]="copied()" />
        </div>
        <div class="mail-link">
          <span class="mail-text" [class.mail-text--exit-up]="copied()">info@asksi.com</span>
          <span class="mail-text" [class.mail-text--exit-down]="!copied()">copied</span>
        </div>
      </div>
    </div>
  </div>
</div>
