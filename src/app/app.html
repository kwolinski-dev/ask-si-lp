<div class="wd-container">
  <div class="w-full">
    <img src="LogoAskSI.svg" alt="Ask SI logo" class="wd-img" class="w-auto h-7 md:h-10" />
  </div>

  <div
    class="w-full flex mt-12 h-[693px] flex-col justify-between md:h-[503px] md:flex-row md:mt-0 md:items-end"
  >
    <div>
      <div class="text-5xl leading-[110%] md:text-[82px] md:leading-[100%]">
        <p class="font-bold">Let's build</p>
        <p class="font-bold">the future.</p>
        <p class="font-light">Faster.</p>
      </div>

      <div
        class="font-bold text-[#FFFFFF] opacity-70 mt-4 leading-[120%] md:mt-10 md:text-[28px] md:leading-[125%]"
      >
        <p>Supercharge for your</p>
        <p>business with Ask SI.</p>
      </div>
    </div>

    <div class="flex overflow-y-hidden overflow-x-scroll mb-12 md:mb-0 md:overflow-hidden">
      @for (item of items(); track $index) {
        <app-card-item [item]="item" />
      }
    </div>
  </div>

  <div class="w-full flex items-center gap-4 pr-5 md:mr-0 md:text-2xl">
    <div class="contact-track">
      <div>Got questions?</div>
      <div class="contact-line"></div>
      <a class="mail-link" href="mailto:info@asksi.com">info@asksi.com</a>
    </div>
  </div>
</div>
