<div class="wd-container">
  <header class="w-full">
    <img src="LogoAskSI.svg" alt="Ask SI" class="wd-img" />
  </header>

  <main
    class="hero-row w-full flex mt-12 flex-col justify-between wide:h-[503px] wide:min-h-0 wide:flex-row wide:mt-0 wide:items-end"
  >
    <div>
      <h1 class="hero-headline whitespace-nowrap">
        <span class="block font-bold">Let's build</span>
        <span class="block font-bold">the future.</span>
        <span class="block font-light">Faster.</span>
      </h1>

      <p class="hero-subheadline whitespace-nowrap font-bold text-[#FFFFFF] opacity-70">
        <span class="block">Supercharge your</span>
        <span class="block">business with Ask SI.</span>
      </p>
    </div>

    <div
      class="card-items-row flex overflow-y-hidden overflow-x-scroll mb-12 wide:mb-0"
      [class.card-items-row--dragging]="isDraggingCards()"
      (mousedown)="onCardsDragStart($event)"
      (mousemove)="onCardsDragMove($event)"
      (mouseup)="onCardsDragEnd()"
      (mouseleave)="onCardsDragEnd()"
    >
      @for (item of items(); track $index) {
        <app-card-item
          [class]="$index === 0 ? 'wide:ml-12' : 'ml-6 md:ml-12'"
          [item]="item"
          [hint]="hintsDismissed() ? undefined : item.mobileHint"
          [active]="activeCardIndices().has($index)"
          (cardClicked)="onCardClicked($index)"
        />
      }
    </div>
  </main>

  <footer class="w-full flex items-center gap-4">
    <div class="contact-track">
      <div>Got questions?</div>
      <div class="contact-line" aria-hidden="true"></div>
      <button
        type="button"
        class="mail-hit"
        aria-label="Copy email address info@asksi.com"
        (click)="copyEmail()"
      >
        <span class="mail-icon-wrap" aria-hidden="true">
          <img src="copie.svg" alt="" class="mail-icon" [class.mail-icon--hidden]="copied()" />
        </span>
        <span class="mail-link" aria-hidden="true">
          <span class="mail-text" [class.mail-text--exit-up]="copied()">info@asksi.com</span>
          <span class="mail-text" [class.mail-text--exit-down]="!copied()">copied</span>
        </span>
      </button>
      <p class="sr-only" role="status">
        {{ copied() ? 'Email address copied to clipboard' : '' }}
      </p>
    </div>
  </footer>
</div>
